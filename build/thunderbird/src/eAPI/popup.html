<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 6px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px; /* Reduced gap slightly to elegantly accommodate the 4th button */
      background-color: #fcfcfc;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f0f0f0;
      cursor: pointer;
      min-width: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover {
      background-color: #e0e0e0;
    }
    /* ENFORCES AN ABSOLUTE STATIC 75PX READOUT BUTTON FOOTPRINT BLOCK */
    #zoom-reset {
      min-width: 75px !important;
      max-width: 75px !important;
      width: 75px !important;
      text-align: center;
    }
    /* WRENCH BUTTON STYLING */
    #open-options {
      min-width: 34px !important;
      max-width: 34px !important;
      padding: 6px 0;
    }
    #open-options svg {
      fill: #555;
    }
    #open-options:hover svg {
      fill: #111;
    }
  </style>
</head>
<body>
  <button id="zoom-out" title="Zoom Out">-</button>
  <button id="zoom-reset" title="Reset Zoom">100%</button>
  <button id="zoom-in" title="Zoom In">+</button>

  <!-- UPDATED ACTION ITEM: Wrench icon button to trigger configuration panels -->
  <button id="open-options" title="Open Settings">
    <svg width="16" height="16" viewBox="0 0 24 24">
      <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.3 4.3C.2 6.7.6 9.7 2.6 11.7c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.8-2.8c.3-.4.3-1.1-.1-1.5z"/>
    </svg>
  </button>

  <script src="popup.js"></script>
</body>
</html>
